<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감성한의원 건강 칼럼 | 경기 남양주</title>
<meta name="description" content="감성한의원 원장 권오경이 전하는 증상별 건강 이야기와 진료 칼럼.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="감성한의원">
<meta property="og:title" content="감성한의원 건강 칼럼">
<meta property="og:description" content="13년 임상 경험을 바탕으로 쓴 증상별 치료 이야기입니다.">
<meta property="og:image" content="https://gamseonghani.com/og-image.jpg">
<meta property="og:url" content="https://gamseonghani.com/column.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="감성한의원 건강 칼럼">
<meta name="twitter:image" content="https://gamseonghani.com/og-image.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>


  :root{
    --bg: #FDFCFA;
    --bg-raised: #F4F5EF;
    --ink: #191A15;
    --ink-soft: #52564B;
    --teal: #163A2E;
    --teal-deep: #0D251C;
    --amber: #8C7A2A;
    --sage: #7C9683;
    --line: #E2E1D6;
    --cream-on-teal: #EEF2EA;
    --focus: #8C7A2A;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #171812;
      --bg-raised: #1F2119;
      --ink: #EDE8DA;
      --ink-soft: #B7B2A2;
      --teal: #6FA592;
      --teal-deep: #0F211C;
      --amber: #D6A75C;
      --sage: #7C9683;
      --line: #3A3A30;
      --cream-on-teal: #F1ECDD;
      --focus: #D6A75C;
    }
  }
  :root[data-theme="dark"]{
    --bg: #171812;
    --bg-raised: #1F2119;
    --ink: #EDE8DA;
    --ink-soft: #B7B2A2;
    --teal: #6FA592;
    --teal-deep: #0F211C;
    --amber: #D6A75C;
    --sage: #7C9683;
    --line: #3A3A30;
    --cream-on-teal: #F1ECDD;
    --focus: #D6A75C;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, sans-serif;
    font-weight: 300;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .serif{
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  a{ color: inherit; }
  :focus-visible{ outline: 2px solid var(--focus); outline-offset: 3px; }
  img{ max-width: 100%; }

  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* header */
  .scroll-progress{
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    width: 0%;
    background: var(--amber);
    z-index: 100;
    transition: width .1s linear;
  }

  .site-header{
    position: sticky; top: 0; z-index: 50;
    background: transparent;
    border-bottom: 1px solid transparent;
    transition: background-color .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .site-header.scrolled{
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 14px rgba(0,0,0,0.05);
    backdrop-filter: blur(6px);
  }
  .site-header .wrap{
    display: flex; align-items: center; justify-content: space-between;
    height: 76px;
    position: relative;
  }
  .wordmark{
    font-family: "Noto Serif KR", serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--teal);
    text-decoration: none;
  }
  .brand-group{ display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .status-badge{
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 600;
    color: var(--teal-deep);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    padding: 5px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-badge .dot{ width: 7px; height: 7px; border-radius: 50%; background: #2E9E5B; flex: none; }
  .status-badge.closed{ color: var(--ink-soft); }
  .status-badge.closed .dot{ background: #B0392E; }
  @media (max-width: 480px){ .status-badge span.status-text{ display: none; } }

  .header-actions{ display: flex; align-items: center; gap: 14px; }
  .search-wrap{ position: relative; display: flex; }
  .icon-btn{
    background: none; border: none; cursor: pointer;
    color: var(--ink-soft); display: flex; padding: 4px;
  }
  .icon-btn svg{ width: 19px; height: 19px; }
  .icon-btn:hover{ color: var(--teal); }
  .btn-reserve{
    background: var(--teal-deep);
    color: #F1ECDD;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 9px 18px;
    border-radius: 999px;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn-reserve:hover{ background: var(--teal); }
  .search-pop{
    display: none;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    z-index: 90;
  }
  .search-pop.open{ display: flex; gap: 8px; }
  .search-pop input{
    font-family: "Noto Sans KR", sans-serif;
    font-size: 0.9rem;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 200px;
    background: var(--bg);
    color: var(--ink);
  }
  .search-hit{ outline: 2px solid var(--amber); outline-offset: 5px; border-radius: 4px; transition: outline-color .3s; }

  .cursor-dot{
    position: fixed; top: 0; left: 0;
    width: 26px; height: 26px;
    border: 1.5px solid var(--teal);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    opacity: 0;
    transition: width .2s ease, height .2s ease, border-color .2s ease, opacity .2s ease;
  }
  @media (pointer: coarse){ .cursor-dot{ display: none; } }

  .site-nav ul{
    display: flex; gap: 34px; list-style: none; margin: 0; padding: 0;
  }
  .site-nav a{
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--ink-soft);
    position: relative;
    padding-bottom: 4px;
  }
  .site-nav a::after{
    content: "";
    position: absolute; left: 0; right: 100%; bottom: 0;
    height: 1px; background: var(--teal);
    transition: right .25s ease;
  }
  .site-nav a:hover::after, .site-nav a:focus-visible::after{ right: 0; }
  .nav-toggle{
    display: block;
    background: none; border: none;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: pointer;
    padding: 8px 0;
  }
  .site-nav{
    display: none;
    position: absolute; left: 0; right: 0; top: 76px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 8px 28px 20px;
  }
  .site-nav .header-actions{ display: none; }
  .site-nav.open{ display: block; }
  .site-nav.open ul{ flex-direction: column; gap: 18px; }
  .site-nav.open .header-actions{
    display: flex;
    margin-left: 0;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  @media (min-width: 760px){
    .nav-toggle{ display: none; }
    .site-nav{
      display: flex;
      align-items: center;
      flex: 1;
      position: static;
      background: none;
      border-bottom: none;
      padding: 0;
      margin-left: 40px;
    }
    .site-nav .header-actions{ display: flex; margin-left: auto; }
  }

  /* hero */
  .hero{
    padding: 96px 0 84px;
    opacity: 0;
    transform: translateY(14px);
    animation: rise .8s ease forwards .1s;
  }
  @keyframes rise{ to{ opacity: 1; transform: none; } }
  .hero-grid{
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 56px;
    align-items: start;
  }
  @media (max-width: 760px){
    .hero-grid{ grid-template-columns: 1fr; }
    .hero-photo{ order: -1; margin: 0 0 12px; max-width: 260px; }
  }
  .hero h1{
    font-size: clamp(1.8rem, 3.4vw, 2.7rem);
    line-height: 1.4;
    color: var(--ink);
    word-break: keep-all;
  }
  .hero .sub{
    margin-top: 22px;
    font-size: 1.15rem;
    color: var(--ink-soft);
  }
  .hero .desc{
    margin-top: 20px;
    font-size: 1.02rem;
    line-height: 1.8;
    color: var(--ink-soft);
    max-width: 480px;
  }
  .hero .feature-tags{
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .hero .feature-tags span{
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--teal-deep);
    border: 1px solid var(--line);
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--bg-raised);
  }
  .hero-photo{
    border: 1px solid var(--line);
    background: #FFFFFF;
    padding: 20px;
    max-width: 340px;
    margin: 0 0 0 auto;
  }
  .hero-photo img{
    display: block;
    width: 100%;
    height: auto;
  }
  .hero-photo figcaption{
    margin-top: 18px;
    font-size: 0.92rem;
    color: var(--ink-soft);
  }
  .hero-photo figcaption strong{
    display: block;
    margin-bottom: 4px;
    font-family: "Noto Serif KR", serif;
    font-size: 1.08rem;
    font-weight: 600;
    color: var(--ink);
  }
  .hero-note{
    margin-top: 22px;
    font-size: 0.92rem;
    color: var(--ink-soft);
  }
  .cta-row{
    margin-top: 34px;
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  .btn{
    display: inline-block;
    padding: 13px 26px;
    text-decoration: none;
    font-size: 0.95rem;
    border-radius: 3px;
    border: 1px solid var(--teal);
  }
  .btn-solid{ background: var(--teal); color: var(--cream-on-teal); }
  .btn-solid:hover{ background: var(--teal-deep); border-color: var(--teal-deep); }
  .btn-line{ color: var(--teal); }
  .btn-line:hover{ background: color-mix(in srgb, var(--teal) 8%, transparent); }

  /* category quick nav */
  .cat-nav{
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--bg-raised);
  }
  .cat-nav ul{
    display: flex;
    list-style: none;
    margin: 0; padding: 0;
    overflow-x: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .cat-nav ul::-webkit-scrollbar{ display: none; }
  .cat-nav li{ flex: none; }
  .cat-nav a{
    display: block;
    padding: 18px 22px;
    text-decoration: none;
    font-size: 0.92rem;
    color: var(--ink-soft);
    white-space: nowrap;
    border-right: 1px solid var(--line);
  }
  .cat-nav li:last-child a{ border-right: none; }
  .cat-nav a:hover, .cat-nav a:focus-visible{ color: var(--teal); }

  /* process */
  .process{ padding: 96px 0; }
  .process h2{ font-size: 1.9rem; }
  .process p.lead{ color: var(--ink-soft); margin-top: 18px; max-width: 640px; }
  .process-steps{
    margin-top: 52px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }
  .process-step{
    padding: 0 24px 0 0;
    border-left: 1px solid var(--line);
    padding-left: 24px;
  }
  .process-step:first-child{ border-left: none; padding-left: 0; }
  .process-step .num{
    font-family: "Noto Serif KR", serif;
    font-size: 1.4rem;
    color: var(--sage);
  }
  .process-step h3{ margin-top: 10px; font-size: 1.05rem; }
  .process-step p{ margin: 10px 0 0; color: var(--ink-soft); font-size: 0.94rem; }
  @media (max-width: 760px){
    .process-steps{ grid-template-columns: 1fr; gap: 28px; }
    .process-step{ border-left: none; padding-left: 0; border-top: 1px solid var(--line); padding-top: 24px; }
    .process-step:first-child{ border-top: none; padding-top: 0; }
  }

  /* philosophy / director */
  .philosophy{
    background: var(--teal-deep);
    color: var(--cream-on-teal);
    padding: 90px 0;
  }
  .philosophy .wrap{ max-width: 680px; }
  .philosophy .eyebrow{
    text-align: center;
    font-size: 0.9rem;
    color: color-mix(in srgb, var(--cream-on-teal) 70%, transparent);
    margin-bottom: 12px;
  }
  .philosophy .director-name{
    text-align: center;
    font-family: "Noto Serif KR", serif;
    font-size: clamp(1.9rem, 4vw, 2.5rem);
    margin-bottom: 16px;
  }
  .philosophy .tagline{
    text-align: center;
    font-family: "Noto Serif KR", serif;
    font-weight: 500;
    font-size: 1.2rem;
    margin-bottom: 44px;
  }
  .philosophy .philosophy-text{
    font-family: "Noto Serif KR", serif;
    font-size: 1.15rem;
    line-height: 1.85;
    margin-bottom: 44px;
  }
  .philosophy hr{
    border: none;
    border-top: 1px solid color-mix(in srgb, var(--cream-on-teal) 22%, transparent);
    margin: 0 0 40px;
  }
  .philosophy .profile-title{
    font-family: "Noto Serif KR", serif;
    font-size: 1.05rem;
    margin-bottom: 20px;
  }
  .philosophy .profile-list{
    list-style: none;
    margin: 0; padding: 0;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .philosophy .profile-list li{
    position: relative;
    padding-left: 20px;
    font-size: 0.96rem;
    line-height: 1.6;
    color: color-mix(in srgb, var(--cream-on-teal) 92%, transparent);
  }
  .philosophy .profile-list li::before{
    content: "+";
    position: absolute;
    left: 0;
    color: var(--amber);
    font-weight: 700;
  }

  /* system */
  .system{ padding: 96px 0; }
  .system-top{
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 48px;
  }
  .system h2{ font-size: 1.9rem; }
  .system-top p{ color: var(--ink-soft); font-size: 1.02rem; margin-top: 18px; }
  .system-note{
    margin-top: 18px;
    font-size: 0.92rem;
    color: var(--sage);
  }
  .body-map{
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  .body-map-item{
    text-align: center;
    padding: 28px 12px;
    border: 1px solid var(--line);
  }
  .body-map-item svg{ width: 40px; height: 40px; stroke: var(--teal); stroke-linecap: round; stroke-linejoin: round; }
  .body-map-item h3{
    margin-top: 14px;
    font-size: 1.05rem;
  }
  @media (max-width: 760px){
    .system-top{ grid-template-columns: 1fr; }
    .body-map{ grid-template-columns: repeat(2, 1fr); }
  }

  /* subjects */
  .subjects{ padding: 20px 0 100px; }
  .subjects h2{ font-size: 1.9rem; margin-bottom: 44px; }
  .subject-row{
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 28px;
    padding: 26px 0;
    border-top: 1px solid var(--line);
  }
  .subjects .subject-row:last-child{ border-bottom: 1px solid var(--line); }
  .subject-row h3{
    font-size: 1.08rem;
    color: var(--teal);
  }
  .subject-row p{
    margin: 0;
    color: var(--ink-soft);
  }
  @media (max-width: 640px){
    .subject-row{ grid-template-columns: 1fr; gap: 8px; }
  }

  /* columns */
  .columns{ padding: 20px 0 100px; }
  .columns h2{ font-size: 1.9rem; margin-bottom: 10px; }
  .columns .lead{ color: var(--ink-soft); margin: 0 0 44px; max-width: 560px; }
  .column-teaser-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .column-teaser{
    display: block;
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 28px;
    transition: border-color .2s ease;
  }
  .column-teaser:hover{ border-color: var(--teal); }
  .column-teaser .cat-tag{
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--teal);
    background: color-mix(in srgb, var(--teal) 10%, transparent);
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .column-teaser h3{
    font-size: 1.1rem;
    color: var(--ink);
    margin: 0 0 10px;
  }
  .column-teaser p{
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }
  @media (max-width: 700px){
    .column-teaser-grid{ grid-template-columns: 1fr; }
  }
  .column-row{
    padding: 30px 0;
    border-top: 1px solid var(--line);
  }
  .columns .column-row:last-child{ border-bottom: 1px solid var(--line); }
  .column-row summary{
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
  }
  .column-row summary::-webkit-details-marker{ display: none; }
  .column-row summary h3{
    font-size: 1.2rem;
    margin: 0;
    color: var(--ink);
  }
  .column-row summary:hover h3{ color: var(--teal); }
  .column-row summary .toggle-label{
    flex: none;
    font-size: 0.88rem;
    color: var(--teal);
    border-bottom: 1px solid currentColor;
    white-space: nowrap;
  }
  .column-row[open] summary .toggle-label::after{ content: "접기"; }
  .column-row:not([open]) summary .toggle-label::after{ content: "전체 글 보기"; }
  .column-row .teaser{
    margin: 12px 0 0;
    color: var(--ink-soft);
    max-width: 640px;
  }
  .column-row[open] .teaser{ display: none; }
  .column-body{
    margin-top: 26px;
    max-width: 680px;
    color: var(--ink-soft);
  }
  .column-body h4{
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    color: var(--ink);
    font-size: 1.05rem;
    margin: 28px 0 10px;
  }
  .column-body h4:first-child{ margin-top: 0; }
  .column-body p{ margin: 0 0 16px; }
  .column-body ul{ margin: 0 0 16px; padding-left: 20px; }
  .column-body li{ margin-bottom: 8px; }
  .column-body .qa{ margin-bottom: 16px; }
  .column-body .qa .q{ color: var(--ink); font-weight: 500; margin-bottom: 4px; }
  .column-body .fine-print{
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  /* visit */
  .visit{
    background: var(--bg-raised);
    padding: 96px 0;
  }
  .visit h2{ font-size: 1.9rem; margin-bottom: 32px; }
  .visit-grid{
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 48px;
    align-items: stretch;
  }
  .visit-info{
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .info-row{
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }
  .info-row .info-icon{
    flex: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--teal) 12%, transparent);
    display: flex; align-items: center; justify-content: center;
  }
  .info-row .info-icon svg{ width: 19px; height: 19px; }
  .info-row .label{
    display: block;
    font-size: 0.82rem;
    color: var(--sage);
    margin-bottom: 4px;
  }
  .info-row .value{
    font-size: 1.05rem;
    color: var(--ink);
    line-height: 1.5;
  }
  .info-row .value a{ text-decoration: none; color: var(--ink); }
  .info-row .value a:hover{ color: var(--teal); }
  .map-embed{
    position: relative;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    min-height: 280px;
  }
  .map-embed iframe{
    width: 100%; height: 100%;
    min-height: 280px;
    border: 0; display: block;
  }
  .map-embed .map-link{
    position: absolute;

  function updateOnScroll(){
    if (window.scrollY > 20){
      siteHeader.classList.add('scrolled');
    } else {
      siteHeader.classList.remove('scrolled');
    }

    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    var pct = docHeight > 0 ? (window.scrollY / docHeight) * 100 : 0;
    scrollProgress.style.width = pct + '%';

    if (window.scrollY > 300){
      backToTop.classList.add('visible');
    } else {
      backToTop.classList.remove('visible');
    }
  }
  window.addEventListener('scroll', updateOnScroll);
  updateOnScroll();

  backToTop.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  var toggle = document.getElementById('navToggle');
  var nav = document.getElementById('mainNav');
  toggle.addEventListener('click', function(){
    var open = nav.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  nav.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){
      nav.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  });

  /* search */
  var searchBtn = document.getElementById('searchBtn');
  var searchPop = document.getElementById('searchPop');
  var searchInput = document.getElementById('searchInput');
  searchBtn.addEventListener('click', function(){
    var open = searchPop.classList.toggle('open');
    searchBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) searchInput.focus();
  });
  document.addEventListener('click', function(e){
    if (!searchPop.contains(e.target) && e.target !== searchBtn && !searchBtn.contains(e.target)){
      searchPop.classList.remove('open');
      searchBtn.setAttribute('aria-expanded', 'false');
    }
  });
  searchInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      var q = searchInput.value.trim().toLowerCase();
      if (!q) return;
      var nodes = document.querySelectorAll('main h1, main h2, main h3, main p, main li, main span');
      var found = null;
      for (var i = 0; i < nodes.length; i++){
        if (nodes[i].textContent.toLowerCase().indexOf(q) !== -1){ found = nodes[i]; break; }
      }
      if (found){
        found.scrollIntoView({behavior:'smooth', block:'center'});
        found.classList.add('search-hit');
        setTimeout(function(){ found.classList.remove('search-hit'); }, 1800);
        searchPop.classList.remove('open');

        searchInput.placeholder = '검색 결과가 없어요';

    window.addEventListener('mousemove', function(e){
      tx = e.clientX; ty = e.clientY;
      dot.style.opacity = '1';
    });
    (function raf(){
      cx += (tx - cx) * 0.2;
      cy += (ty - cy) * 0.2;
      dot.style.left = cx + 'px';
      dot.style.top = cy + 'px';
      requestAnimationFrame(raf);
    })();
    document.querySelectorAll('a, button').forEach(function(el){

      3: { open: 9.5, close: 20,   breakStart: 13, breakEnd: 14 },  // 수
      4: { open: 9.5, close: 19,   breakStart: 13, breakEnd: 14 },  // 목
      5: { open: 9.5, close: 20,   breakStart: 13, breakEnd: 14 },  // 금
      6: { open: 9.5, close: 14.5, breakStart: null, breakEnd: null } // 토
    };
    var badge = document.getElementById('statusBadge');
    var text = document.getElementById('statusText');
    var now = new Date();
    var day = now.getDay();
    var today = hours[day];
    var nowVal = now.getHours() + now.getMinutes() / 60;

    function fmt(v){
      var h = Math.floor(v);
      var m = Math.round((v - h) * 60);
      var hh = h < 10 ? '0' + h : '' + h;
      var mm = m < 10 ? '0' + m : '' + m;
      return hh + ':' + mm;
    }

    if (!today){
      badge.classList.add('closed');
      text.textContent = '일요일 휴진';
    } else if (nowVal < today.open){
      badge.classList.add('closed');
      text.textContent = '진료 전 · ' + fmt(today.open) + ' 진료 시작';
    } else if (today.breakStart != null && nowVal >= today.breakStart && nowVal < today.breakEnd){
      badge.classList.add('closed');
      text.textContent = '점심시간 · ' + fmt(today.breakEnd) + ' 진료 재개';
    } else if (nowVal >= today.open && nowVal < today.close){
      badge.classList.remove('closed');
      text.textContent = '진료중 · ' + fmt(today.close) + ' 진료 종료';
    } else {
      badge.classList.add('closed');
      text.textContent = '진료 종료';
    }
  })();

  var CATEGORY_LABELS = {
    philosophy: '원장 이야기',
    headache: '두통 · 어지러움',
    jaw: '턱관절',
    sensory: '감각기관 · 신경계',
    spine: '척추 · 근골격',
    internal: '내과 질환',
    pediatric: '소아 클리닉',
    special: '다이어트 클리닉'
  };

  function renderColumns(items){
    var wrap = document.getElementById('columnListWrap');
    wrap.innerHTML = '';

    var sorted = items.slice().sort(function(a, b){
      return (b.date || '').localeCompare(a.date || '');
    });

    sorted.forEach(function(item, i){
      var details = document.createElement('details');
      details.className = 'column-row';
      details.setAttribute('data-category', item.category || '');

      var bodyHtml = (typeof marked !== 'undefined' && item.body)
        ? marked.parse(item.body)
        : '<p>' + (item.body || '') + '</p>';

      details.innerHTML =
        '<summary>' +
          '<div>' +
            '<span class="cat-tag">' + (CATEGORY_LABELS[item.category] || item.category || '') + '</span>' +
            '<h3>' + (item.title || '') + '</h3>' +
          '</div>' +
          '<span class="toggle-label"></span>' +
        '</summary>' +
        '<p class="teaser">' + (item.teaser || '') + '</p>' +
        '<div class="column-body">' + bodyHtml + '</div>';

      wrap.appendChild(details);
    });
  }

  function initFilters(){
    var tabs = document.querySelectorAll('#catTabs button');
    tabs.forEach(function(btn){
      btn.addEventListener('click', function(){
        var rows = document.querySelectorAll('.column-row');
        tabs.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        var filter = btn.getAttribute('data-filter');
        rows.forEach(function(row){
          row.hidden = !(filter === 'all' || row.getAttribute('data-category') === filter);
        });
      });
    });
  }

  fetch('content/columns.json')
    .then(function(res){ return res.json(); })
    .then(function(data){
      renderColumns(data.items || []);
      initFilters();
    })
    .catch(function(err){
      document.getElementById('columnListWrap').innerHTML =
        '<p class="loading-note">칼럼을 불러오지 못했어요. 잠시 후 다시 시도해주세요.</p>';
      console.error(err);
    });

</script>

</body>
</html>
